<title id="title">NODA: agentic RAN diagnosis</title>
<desc id="desc">English adaptation of Figure 1: an LLM agent plans diagnostic tasks, coordinates execution, and uses tools, domain knowledge, and historical cases to generate evidence-grounded diagnosis reports.</desc>
